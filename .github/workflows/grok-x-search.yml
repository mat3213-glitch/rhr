name: grok-x-search

# Daily Grok-powered X/Twitter search for business opportunities.
# Grok has native X access — searches for passive income, micro SaaS,
# AI wrappers, DeFi yield, automation bots signals.
# Results are ingested into the RHR pipeline.

# 🔴 РАСПИСАНИЕ СНЯТО 2026-08-03 (решение yaromat). Причина: XAI_API_KEY в секретах нет,
# воркфлоу падал ежедневно за 15 секунд («[grok] XAI_API_KEY not set») минимум с 29.07 и
# красил репо. Он ДУБЛИРУЕТ живой бесплатный канал: веб-задача Grok по scripts/grok_task_prompt.md
# каждый день кладёт signals/incoming/grok_<дата>.json, а grok-rhr-ingest его съедает.
# Поиск НОВИНОК инструментов это не трогает — он идёт другими каналами (repo_scout → тред 468,
# grok bridge → auto_analyst → тред 1653).
# Вернуть в строй: положить XAI_API_KEY в секреты и раскомментировать schedule.
on:
  # schedule:
  #   - cron: "0 9 * * *"   # daily at 09:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

concurrency:
  group: db-write
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init DB (if missing)
        run: python run.py init

      - name: Run Grok X search
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: bash -o pipefail -c "python scripts/grok_search.py | python run.py ingest-stdin"

      - name: Commit DB snapshot
        run: |
          python -c "import sqlite3; sqlite3.connect('data/rhr.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"
          git config user.name "rhr-bot"
          git config user.email "actions@github.com"
          git add data/rhr.db || true
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
          else
            git commit -m "data: grok x-search $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main
            git push
          fi
