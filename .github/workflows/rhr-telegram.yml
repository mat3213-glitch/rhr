name: rhr-telegram

# Full pipeline: scan Telegram → classify → score → create GitHub Issues.
# Runs twice daily (aligned with sources.yaml telegram.schedule).
# One workflow = one complete cycle. Persists data/rhr.db back to git
# (repo-as-database) so re-runs do not re-create Issues for tracked candidates
# (track.py only selects rows with github_issue_number IS NULL).

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC
    - cron: "43 19 * * *"  # 19:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: db-write
  # Never cancel an in-progress DB writer: a cancellation between issue creation
  # and the DB commit could orphan already-created GitHub Issues.
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init DB
        run: python run.py init

      - name: Scan Telegram channels
        run: python run.py scan telegram

      - name: Classify + Score
        run: python run.py pipeline

      - name: Create Issues for top candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run.py track --top 10

      - name: Bridge top candidates to s2c moderation
        # Closes the loop: classify -> worker /rewrite -> /add -> Bot moderation.
        # Marks forwarded candidates in data/rhr.db (bridge_forwarded), so this
        # step MUST run before the DB snapshot commit below.
        # continue-on-error: a missing secret / transient worker error must not
        # block the DB snapshot commit; forwarded marks persist either way.
        continue-on-error: true
        env:
          S2C_WORKER_URL: ${{ secrets.S2C_WORKER_URL }}
          S2C_WORKER_SECRET: ${{ secrets.S2C_WORKER_SECRET }}
        run: python scripts/bridge_to_s2c.py --limit 5

      - name: Commit DB snapshot
        # Same pattern as grok-rhr-ingest.yml: checkpoint WAL, commit, rebase, push.
        # Persists signals, candidates, and github_issue_number so the next run
        # skips already-tracked candidates (no duplicate Issues).
        run: |
          python -c "import sqlite3; sqlite3.connect('data/rhr.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"
          git config user.name "rhr-bot"
          git config user.email "actions@github.com"
          git add data/rhr.db || true
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
          else
            git commit -m "data: telegram pipeline $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Build dashboard
        run: python dashboard/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Show status
        run: python run.py status

  deploy-dashboard:
    needs: pipeline
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
