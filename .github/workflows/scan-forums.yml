name: scan

# Fetches raw signals from enabled public/clean sources whose schedule is due.
# The workflow ticks every ~30 min; per-source cadence lives in
# config/sources.yaml (`schedule` + `tier: public`) and is enforced by
# `python run.py scan --due --tier public` (see schedule_util.py).
#
# Deep/sensitive sources (Telegram, Reddit, …) are tier: deep and must NOT
# run here — they have dedicated workflows (rhr-telegram.yml) or self-hosted
# runners.
#
# Note on cron: GitHub Actions cron has ~5-15 min jitter and doesn't guarantee
# exact timing. We schedule conservatively; correctness does not depend on it.

on:
  schedule:
    - cron: "*/30 * * * *"   # dispatcher tick; individual sources use their own schedule
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write             # to commit the DB back (repo-as-database)
  issues: write               # the classify job creates issues

concurrency:
  group: db-write
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init DB (if missing)
        run: python run.py init

      - name: Restore last DB snapshot
        run: |
          # The DB lives in git (repo-as-database). It is checked out with the repo.
          # If you prefer artifacts instead, download the latest DB artifact here.
          if [ ! -f data/rhr.db ]; then python run.py init; fi

      - name: Scan due public sources
        # Honours config/sources.yaml schedule + tier. Skips youtube/rss/etc.
        # when their cron is not due; never runs tier: deep (telegram/reddit).
        run: python run.py scan --due --tier public
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRODUCTHUNT_API_TOKEN: ${{ secrets.PRODUCTHUNT_API_TOKEN }}

      - name: Commit DB snapshot
        run: |
          python -c "import sqlite3; sqlite3.connect('data/rhr.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"
          git config user.name "rhr-bot"
          git config user.email "actions@github.com"
          git add data/rhr.db || true
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
          else
            git commit -m "data: scan snapshot $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main
            git push
          fi
