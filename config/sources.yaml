# RHR source registry.
# Each collector reads the relevant entries here. Add/remove freely.
# `enabled: false` keeps a source defined but skips it.
#
# schedule — 5-field cron (min hour dom month dow). Consumed by
#   `python run.py scan --due` (see schedule_util.py). The public GH workflow
#   runs every ~30 min and only executes sources whose schedule is due.
#   Do not leave schedule as decoration: the dispatcher uses it.
#
# tier — `public` (clean, safe on github-hosted runners) or `deep`
#   (sensitive / ToS-grey / needs self-hosted). Public workflow uses
#   `--tier public`; deep sources have dedicated workflows (e.g. rhr-telegram).

sources:

  # ───────────────────────────── CLEAN / PUBLIC (Phase 1) ─────────────────────────────
  hackernews:
    enabled: true
    tier: public
    type: hackernews
    schedule: "*/30 * * * *"        # every 30 min — front + show + ask + best
    params:
      endpoints: [topstories, showstories, askstories, beststories]
      max_items_per_endpoint: 60
      min_points: 15                # drop zero-traction noise; tune per source

  rss:
    enabled: true
    tier: public
    type: rss
    schedule: "0 */4 * * *"         # every 4h
    params:
      feeds:
        - https://www.indiehackers.com/feed            # IndieHackers (fixed URL)
        - https://hnrss.org/frontpage                   # HN front via RSS bridge
        - https://www.producthunt.com/feed              # Product Hunt
        - https://news.ycombinator.com/rss             # HN direct
      max_items_per_feed: 50

  # ───────────────────────────── AGGREGATORS (Phase 2) ─────────────────────────────
  defillama:
    enabled: true
    tier: public
    type: defillama
    schedule: "0 */6 * * *"
    params:
      chains: [Ethereum, Solana, Base, Arbitrum]
      min_tvl_usd: 1000000
      yield_min_apr: 8.0

  producthunt:
    enabled: true
    tier: public
    type: producthunt
    schedule: "0 8 * * *"           # daily, when PH resets
    params:
      max_items: 30

  youtube:
    enabled: true
    tier: public
    type: youtube
    schedule: "0 */12 * * *"        # 2x/day: 2 × 4 terms × 10 = 8000 units (limit 10k)
    params:
      search_terms:
        - "passive income"
        - "make money online"
        - "micro saas"
        - "ai wrapper"
      max_results_per_term: 10

  # Бесключевой близнец youtube: тот же поиск через бинарь yt-dlp, вне квоты Google.
  # Проверено на US-раннере 2026-08-03: ПОИСК работает без ключа и кук (субтитры — нет).
  # Работает чаще квотного собрата и берёт шире по терминам; дедуп общий, пересечение
  # с `youtube` гасится на уровне pipeline/dedup по URL.
  youtube_ytdlp:
    enabled: true
    tier: public
    type: youtube_ytdlp
    schedule: "0 */6 * * *"        # 4x/day — квоты нет, ограничение только по вежливости
    params:
      search_terms:
        - "passive income"
        - "make money online"
        - "micro saas"
        - "ai wrapper"
        - "indie hacker revenue"
        - "automation bot side project"
      max_results_per_term: 10
      timeout: 120

  gumroad:
    enabled: true
    tier: public
    type: gumroad
    schedule: "0 */6 * * *"
    params:
      max_items: 30

  # ───────────────────────────── DEEP / SENSITIVE (Phase 3, self-hosted / dedicated WF) ────
  # Not scanned by .github/workflows/scan-forums.yml (--tier public).
  reddit:
    enabled: true
    tier: deep
    type: reddit
    schedule: "*/30 * * * *"
    params:
      subreddits:
        - Entrepreneur
        - beermoney
        - SideProject
        - passive_income
        - SaaS
        - DeFi
        - Arbitrage
      max_items_per_sub: 25
      min_score: 10

  telegram:
    enabled: true
    tier: deep
    type: telegram
    schedule: "17 7,19 * * *"       # mirrored by rhr-telegram.yml crons
    params:
      channels:
        # Passive income / Side hustles
        - passiveincome
        - sidehustle
        - makemoneyonline
        - freelancing
        # SaaS / Micro-SaaS
        - saas
        - indiehackers_ru
        - microsaas
        # AI / Automation
        - ai_tools
        - automation
        - gpt_prompts
        # DeFi / Crypto
        - defi
        - crypto_signals
        - airdrops
        # E-commerce / Arbitrage
        - dropshipping
        - arbitrage
        - ecommerce
        # Niche
        - nocode
        - affiliatemarketing
      max_messages_per_channel: 50
